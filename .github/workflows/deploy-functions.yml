# Spec 008 §7 — push 到 v4 觸碰 supabase/functions/** 時自動部署 Edge Functions。
# 需要 GitHub secret：SUPABASE_ACCESS_TOKEN（Supabase Dashboard → Account → Access Tokens）。
name: deploy-functions
on:
  push:
    branches: [v4]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref ifbpfuvlevjegwdnhyqh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
